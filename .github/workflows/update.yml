name: Update the list
on:
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update.py
      - run: |
          git config user.name "SpaceJobs.Now"
          git config user.email "hello@spacejobs.now"
          git add -A
          git diff --cached --quiet || git commit -m "Update the list ($(date -u +%F))"
          git push
      - name: Tell search engines the list changed (IndexNow)
        run: |
          curl -s -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"spacejobsnow.github.io","key":"fbb75c5fcea9d288daab79fd8a99bbb6","keyLocation":"https://spacejobsnow.github.io/Summer2027-Space-Internships/fbb75c5fcea9d288daab79fd8a99bbb6.txt","urlList":["https://spacejobsnow.github.io/Summer2027-Space-Internships/","https://spacejobsnow.github.io/Summer2027-Space-Internships/INTERNATIONAL"]}' \
            -o /dev/null -w "IndexNow %{http_code}\n" || true
