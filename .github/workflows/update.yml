name: Update the list
on:
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update.py
      - run: |
          git config user.name "SpaceJobs.Now"
          git config user.email "hello@spacejobs.now"
          git add -A
          git diff --cached --quiet || git commit -m "Update the list ($(date -u +%F))"
          git push
